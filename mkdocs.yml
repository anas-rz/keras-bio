site_name: keras-bio
site_description: Multi-Backend Biological Sequence and Structure Foundation Models in Keras 3
site_author: keras-bio contributors
repo_name: anas-rz/keras-bio
repo_url: https://github.com/anas-rz/keras-bio

theme:
  name: material
  language: en
  icon:
    logo: material/dna
    repo: fontawesome/brands/github
  font:
    text: Inter
    code: JetBrains Mono
  palette:
    # Palette toggle for automatic mode based on system preference
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: white
      accent: red
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    # Palette toggle for dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: black
      accent: red
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.expand
    - navigation.path
    - navigation.top
    - navigation.tracking
    - search.suggest
    - search.highlight
    - search.share
    - content.code.copy
    - content.code.select
    - content.code.annotate
    - content.tabs.link

extra_css:
  - stylesheets/extra.css

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.arithmatex:
      generic: true
  - tables
  - attr_list
  - md_in_html

extra_javascript:
  - javascripts/mathjax.js
  - https://unpkg.com/mathjax@3/es5/tex-mml-chtml.js

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [.]
          options:
            show_root_heading: true
            show_source: true

nav:
  - Overview: index.md
  - Getting Started:
      - Installation: getting-started/installation.md
      - Multi-Backend Guide: getting-started/backends.md
  - Protein Models:
      - ProtT5: models/protein/prot_t5.md
      - ESM-2: models/protein/esm2.md
  - DNA Models:
      - DNABERT: models/dna/dnabert.md
      - HyenaDNA: models/dna/hyenadna.md
  - 3D Structure Models:
      - ESMFold: models/structure/esmfold.md
  - Guides:
      - Weight Porting: guides/weights_conversion.md
      - PDB Structure Export: guides/structure_pdb.md
  - API Reference:
      - Protein: api/protein.md
      - DNA: api/dna.md
      - Structure: api/structure.md
